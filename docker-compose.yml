services:
  case-studio-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: case-studio-suite
    ports:
      - "3088:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./skills_catalog:/app/skills_catalog
      - /Volumes/Spacestation/MCP/Antigravity-MCP-tools:/Volumes/Spacestation/MCP/Antigravity-MCP-tools:ro
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/case_studio.db
      - SKILLS_CATALOG_DIR=/app/skills_catalog
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-3.5-flash-lite}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-gemini-3.5-flash-lite}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  archify-service:
    build:
      context: ./services/archify-sidecar
      dockerfile: Dockerfile
    container_name: archify-service
    profiles:
      - archify
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
